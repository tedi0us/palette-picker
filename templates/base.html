<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Palette Picker{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23cba6f7'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%231e1e2e'/%3E%3Ccircle cx='21' cy='12' r='3' fill='%2389dceb'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23a6e3a1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mockup.css') }}" />
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body hx-indicator="#busy">
  <div id="busy" class="htmx-indicator">working…</div>
  {% block body %}{% endblock %}
  <div class="toast-stack" id="toasts"></div>
</body>
</html>
